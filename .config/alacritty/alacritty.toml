[window]
padding = { x = 5, y = 5 }
decorations = "None"
opacity = 0.72
blur = true
resize_increments = true

[font]
size = 12.0
normal = { family = "JetBrainsMono Nerd Font Propo", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Propo", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Propo", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Propo", style = "Bold Italic" }

[colors]
transparent_background_colors = true
draw_bold_text_with_bright_colors = false
cursor = { text = "#090a0f", cursor = "#c0caf5" }
vi_mode_cursor = { text = "#090a0f", cursor = "#ff9e64" }
selection = { text = "#d5defd", background = "#283457" }
footer_bar = { foreground = "#d5defd", background = "#15161e" }
indexed_colors = [
  { index = 16, color = "#ff9e64" },
  { index = 17, color = "#db4b4b" },
]

[colors.primary]
background = "#090a0f"
foreground = "#d5defd"

[colors.search]
matches = { foreground = "#090a0f", background = "#e0af68" }
focused_match = { foreground = "#090a0f", background = "#ff9e64" }

[colors.hints]
start = { foreground = "#090a0f", background = "#e0af68" }
end = { foreground = "#d5defd", background = "#283457" }

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#565f89"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

[cursor]
style = { shape = "Block", blinking = "Off" }

[terminal]
shell = { program = "/usr/bin/zsh", args = ["-l"] }


